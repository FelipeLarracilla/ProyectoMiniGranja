<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniGranja IoT</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#f4f7f1;
    --card:#ffffff;
    --primary:#4caf50;
    --primary-dark:#2e7d32;
    --earth:#8d6e63;
    --accent:#ffb300;
    --text:#263238;
    --shadow:0 8px 20px rgba(0,0,0,0.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
    color:white;
    padding:25px;
    box-shadow:var(--shadow);
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.header-title h1{
    margin:0;
    font-size:32px;
}

.header-title p{
    margin:5px 0 0;
    opacity:0.9;
}

.status-badge{
    background:rgba(255,255,255,0.2);
    padding:10px 15px;
    border-radius:30px;
    font-size:14px;
    backdrop-filter:blur(8px);
}

.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:20px;
}

select{
    padding:12px 15px;
    border:none;
    border-radius:12px;
    background:var(--card);
    box-shadow:var(--shadow);
    font-size:15px;
    color:var(--text);
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:var(--card);
    border-radius:18px;
    padding:20px;
    box-shadow:var(--shadow);
    transition:0.3s;
    position:relative;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-3px);
}

.card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:6px;
    height:100%;
}

.card.temp::before{background:var(--primary);}
.card.hum::before{background:#29b6f6;}
.card.c1::before{background:#66bb6a;}
.card.c2::before{background:var(--earth);}
.card.c3::before{background:var(--accent);}

.card h3{
    margin:0;
    font-size:16px;
    color:#607d8b;
}

.card h2{
    margin:15px 0 5px;
    font-size:34px;
}

.config{
    background:var(--card);
    padding:20px;
    border-radius:18px;
    box-shadow:var(--shadow);
    margin-bottom:25px;
}

.config h2{
    margin-top:0;
}

.config-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-top:15px;
}

.config-item{
    display:flex;
    flex-direction:column;
}

.config-item label{
    margin-bottom:8px;
    font-weight:600;
}

.config-item input{
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:15px;
}

button{
    margin-top:20px;
    background:var(--primary);
    color:white;
    border:none;
    padding:14px 22px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:var(--primary-dark);
}

.chart-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(500px,1fr));
    gap:20px;
}

.chart-container{
    background:var(--card);
    padding:20px;
    border-radius:18px;
    box-shadow:var(--shadow);
}

canvas{
    width:100% !important;
    height:350px !important;
}

.footer-status{
    margin-top:20px;
    text-align:center;
    color:#607d8b;
}

@media(max-width:700px){

    .chart-grid{
        grid-template-columns:1fr;
    }

    canvas{
        height:280px !important;
    }

    .header-title h1{
        font-size:24px;
    }

}

</style>
</head>

<body>

<header>

<div class="header-top">

<div class="header-title">
    <h1>🌾 MiniGranja IoT</h1>
    <p>Monitoreo inteligente de maternidad porcina</p>
</div>

<div class="status-badge" id="connectionStatus">
    🟢 Sistema conectado
</div>

</div>

</header>

<div class="container">

<div class="top-bar">

<select id="range" onchange="cargarDatos()">
    <option value="30m">30 min</option>
    <option value="1h">1 hora</option>
    <option value="3h">3 horas</option>
    <option value="6h">6 horas</option>
    <option value="12h">12 horas</option>
    <option value="24h" selected>24 horas</option>
    <option value="3d">3 días</option>
    <option value="week">Semana</option>
    <option value="month">Mes</option>
    <option value="year">Año</option>
</select>

<div id="status">
    Cargando...
</div>

</div>

<!-- CARDS PRINCIPALES -->

<div class="cards">

<div class="card temp">
    <h3>🌡️ Temp Ambiente</h3>
    <h2 id="temp">--</h2>
</div>

<div class="card hum">
    <h3>💧 Humedad</h3>
    <h2 id="hum">--</h2>
</div>

<div class="card c1">
    <h3>🐷 Cuna 1</h3>
    <h2 id="c1">--</h2>
</div>

<div class="card c2">
    <h3>🐷 Cuna 2</h3>
    <h2 id="c2">--</h2>
</div>

<div class="card c3">
    <h3>🐷 Cuna 3</h3>
    <h2 id="c3">--</h2>
</div>

</div>

<!-- EDADES -->

<div class="cards">

<div class="card c1">
    <h3>🐷 Edad Cuna 1</h3>
    <h2 id="edad1">-- días</h2>
</div>

<div class="card c2">
    <h3>🐷 Edad Cuna 2</h3>
    <h2 id="edad2">-- días</h2>
</div>

<div class="card c3">
    <h3>🐷 Edad Cuna 3</h3>
    <h2 id="edad3">-- días</h2>
</div>

</div>

<!-- CONFIG -->

<div class="config">

<h2>⚙️ Configuración de edades</h2>

<div class="config-grid">

<div class="config-item">
    <label>Cuna 1</label>
    <input type="date" id="fecha1">
</div>

<div class="config-item">
    <label>Cuna 2</label>
    <input type="date" id="fecha2">
</div>

<div class="config-item">
    <label>Cuna 3</label>
    <input type="date" id="fecha3">
</div>

</div>

<button onclick="enviarConfiguracion()">
    Guardar configuración
</button>

</div>

<!-- CHARTS -->

<div class="chart-grid">

<div class="chart-container">
    <canvas id="cunasChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="tempChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="humChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="controlChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="ventChart"></canvas>
</div>

</div>

<div class="footer-status" id="lastUpdate">
    Esperando datos...
</div>

</div>

<script>

const API =
"https://mu5cj8jjzb.execute-api.us-east-1.amazonaws.com/temperaturas";

const CONFIG_API =
"https://tqb2se27sg.execute-api.us-east-1.amazonaws.com/config";

let charts = {};

// ================= CONFIG =================

async function enviarConfiguracion(){

    try{

        const fecha1 =
            document.getElementById("fecha1").value;

        const fecha2 =
            document.getElementById("fecha2").value;

        const fecha3 =
            document.getElementById("fecha3").value;

        const payload = {

            inicio_cuna1:
                Math.floor(new Date(fecha1).getTime()/1000),

            inicio_cuna2:
                Math.floor(new Date(fecha2).getTime()/1000),

            inicio_cuna3:
                Math.floor(new Date(fecha3).getTime()/1000)

        };

        const res = await fetch(CONFIG_API,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(payload)

        });

        const data = await res.json();

        console.log(data);

        alert("✅ Configuración enviada");

    }catch(err){

        console.error(err);

        alert("❌ Error enviando configuración");
    }
}

// ================= DATOS =================

async function cargarDatos(){

    try{

        document.getElementById("connectionStatus")
        .innerHTML = "🟡 Cargando datos...";

        const range =
            document.getElementById("range").value;

        const res =
            //await fetch(`${API}?range=${range}`);
            await fetch(`${API}?range=${range}&points=60`)

        const data =
            await res.json();

        renderData(data);

        document.getElementById("connectionStatus")
        .innerHTML = "🟢 Sistema conectado";

    }catch(err){

        console.error(err);

        document.getElementById("connectionStatus")
        .innerHTML = "🔴 Error conexión";

    }

}

// ================= RENDER =================

function renderData(data){

    if(!data || !data.length) return;

    document.getElementById("status")
    .innerText = `${data.length} registros`;

    const labels = data.map(d=>{

        const date =
            new Date(d.timestamp * 1000);

        return date.toLocaleString('es-MX',{

            day:'2-digit',
            month:'short',
            hour:'2-digit',
            minute:'2-digit'

        });

    });

    const c1 = data.map(d=>d.payload?.cunas?.cuna1 ?? 0);
    const c2 = data.map(d=>d.payload?.cunas?.cuna2 ?? 0);
    const c3 = data.map(d=>d.payload?.cunas?.cuna3 ?? 0);

    const temp =
        data.map(d=>d.payload?.ambiente?.temp ?? 0);

    const hum =
        data.map(d=>d.payload?.ambiente?.hum ?? 0);

    const foco1 =
        data.map(d=>d.payload?.control?.cuna1?.foco ?? 0);

    const foco2 =
        data.map(d=>d.payload?.control?.cuna2?.foco ?? 0);

    const foco3 =
        data.map(d=>d.payload?.control?.cuna3?.foco ?? 0);

    const ventilador =
        data.map(
            d=>d.payload?.control?.ventilador ?? 0
        );

    const last = data[data.length-1].payload;

    document.getElementById("temp")
    .innerText = `${last.ambiente.temp} °C`;

    document.getElementById("hum")
    .innerText = `${last.ambiente.hum} %`;

    document.getElementById("c1")
    .innerText = `${last.cunas.cuna1} °C`;

    document.getElementById("c2")
    .innerText = `${last.cunas.cuna2} °C`;

    document.getElementById("c3")
    .innerText = `${last.cunas.cuna3} °C`;

    document.getElementById("edad1")
    .innerText = `${last.edades.cuna1} días`;

    document.getElementById("edad2")
    .innerText = `${last.edades.cuna2} días`;

    document.getElementById("edad3")
    .innerText = `${last.edades.cuna3} días`;

    document.getElementById("lastUpdate")
    .innerText =
    `Última actualización: ${
        new Date().toLocaleTimeString()
    }`;

    for(let key in charts){

        if(charts[key])
            charts[key].destroy();
    }

    const options = (title,yLabel)=>({

        responsive:true,

        plugins:{

            title:{
                display:true,
                text:title,
                color:"#263238",
                font:{
                    size:18
                }
            },

            legend:{
                labels:{
                    color:"#263238"
                }
            }

        },

        scales:{

            y:{
                title:{
                    display:true,
                    text:yLabel
                },
                ticks:{
                    color:"#263238"
                }
            },

            x:{
                ticks:{
                    color:"#263238"
                }
            }

        }

    });

    charts.cunas = new Chart(cunasChart,{

        type:"line",

        data:{
            labels,
            datasets:[

                {
                    label:"Cuna 1",
                    data:c1,
                    borderColor:"#4caf50",
                    tension:0.4,
                    borderWidth:3
                },

                {
                    label:"Cuna 2",
                    data:c2,
                    borderColor:"#8d6e63",
                    tension:0.4,
                    borderWidth:3
                },

                {
                    label:"Cuna 3",
                    data:c3,
                    borderColor:"#ffb300",
                    tension:0.4,
                    borderWidth:3
                }

            ]
        },

        options:options(
            "🌡️ Temperatura por Cuna",
            "Temperatura °C"
        )

    });

    charts.temp = new Chart(tempChart,{

        type:"line",

        data:{
            labels,
            datasets:[

                {
                    label:"Ambiente",
                    data:temp,
                    borderColor:"#2e7d32",
                    tension:0.4,
                    borderWidth:3
                }

            ]
        },

        options:options(
            "🌡️ Temperatura Ambiente",
            "°C"
        )

    });

    charts.hum = new Chart(humChart,{

        type:"line",

        data:{
            labels,
            datasets:[

                {
                    label:"Humedad",
                    data:hum,
                    borderColor:"#29b6f6",
                    tension:0.4,
                    borderWidth:3
                }

            ]
        },

        options:options(
            "💧 Humedad Ambiente",
            "%"
        )

    });

    charts.control = new Chart(controlChart,{

        type:"line",

        data:{
            labels,
            datasets:[

                {
                    label:"Foco C1",
                    data:foco1,
                    borderColor:"#4caf50",
                    tension:0.4,
                    borderWidth:3
                },

                {
                    label:"Foco C2",
                    data:foco2,
                    borderColor:"#8d6e63",
                    tension:0.4,
                    borderWidth:3
                },

                {
                    label:"Foco C3",
                    data:foco3,
                    borderColor:"#ffb300",
                    tension:0.4,
                    borderWidth:3
                }

            ]
        },

        options:options(
            "💡 Potencia de Focos",
            "%"
        )

    });

    charts.vent = new Chart(ventChart,{

        type:"line",

        data:{

            labels,

            datasets:[

                {

                    label:"Ventilador",

                    data:ventilador,

                    borderColor:"#42a5f5",

                    tension:0.4,

                    borderWidth:3,

                    fill:false
                }

            ]
        },

        options:options(

            "🌬️ Potencia Ventilador",

            "%"
        )
    });

}

cargarDatos();

setInterval(cargarDatos,60000);

</script>

</body>
</html>
